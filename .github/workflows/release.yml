name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          minor=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          tag="v${minor}.${{ github.run_number }}"
          gh release create "$tag" release/speedtest.js \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --generate-notes
